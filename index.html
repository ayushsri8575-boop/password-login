<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="username" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="passwaord" required>
            </div>

            <button type="submit" class="btn">Login</button>
        </form>
        <div id="welcomeBox" style="display: none; margin-top: 15px;">
            <h1 id="greetingText" style="color: skyblue; margin-bottom: 10px;">Hello! 👋</h1>
            <p style="color: gray;">Login Successful</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
